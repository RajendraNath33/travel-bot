# Alag project: purane containers (n8n, n8n-main, cloudflared...) se koi takkar nahi
name: travel-bot

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n-travel
    restart: unless-stopped
    env_file: .env
    environment:
      - N8N_HOST=travelbot.shilpshakti.org.in
      - N8N_PROTOCOL=https
      - N8N_PORT=5678
      - WEBHOOK_URL=https://travelbot.shilpshakti.org.in/
      - N8N_PROXY_HOPS=1
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - GENERIC_TIMEZONE=Asia/Kolkata
      - TZ=Asia/Kolkata
    volumes:
      - n8n_travel_data:/home/node/.n8n
    # koi ports publish nahi: sirf Cloudflare tunnel andar se access karega

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-travel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - n8n

volumes:
  n8n_travel_data:
